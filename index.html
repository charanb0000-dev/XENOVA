<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XENOVA AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px}
.app{width:100%;max-width:900px;height:100vh;max-height:900px;background:#111118;border-radius:32px;display:flex;flex-direction:column;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);border:1px solid #1e1e2a;overflow:hidden}
.header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e1e2a;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#6d5dfc,#b25dfc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:white}
.logo-text{font-size:20px;font-weight:600;color:#fff}
.badge{font-size:11px;padding:4px 10px;border-radius:20px;background:#1e1e2a;color:#a09ac0;border:1px solid #2a2a3a}
.chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.message{display:flex;gap:12px;max-width:100%;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.user{flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.avatar.bot{background:#2a2a3a;border:1px solid #2d2d3d;color:#b0a8ff}
.avatar.user{background:#2a2a3a;border:1px solid #3a3a4a;color:#d0d0e0}
.bubble{padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.6;max-width:80%;word-break:break-word;white-space:pre-wrap}
.bubble.user{background:#6d5dfc;color:white;border-bottom-right-radius:6px}
.bubble.bot{background:#1a1a24;color:#e4e4f0;border:1px solid #2a2a3a;border-bottom-left-radius:6px}
.bubble.bot .tip{margin-top:10px;padding-top:8px;border-top:1px solid #2a2a3a;color:#9a94b0;font-size:13px;font-style:italic}
.typing{display:flex;gap:5px;padding:8px 4px}
.typing span{width:7px;height:7px;background:#6d5dfc;border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.input-area{padding:12px 16px 18px;background:#111118;border-top:1px solid #1e1e2a;flex-shrink:0}
.input-wrap{display:flex;gap:10px;align-items:flex-end;background:#1a1a24;border-radius:28px;padding:6px 6px 6px 20px;border:1px solid #2a2a3a}
.input-wrap:focus-within{border-color:#6d5dfc}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:#e4e4f0;font-size:15px;resize:none;padding:8px 0;max-height:120px;line-height:1.5;font-family:inherit}
.input-wrap textarea::placeholder{color:#5a5a70}
.send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6d5dfc,#8a5dfc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn svg{width:20px;height:20px;fill:white}
.footer-note{text-align:center;font-size:11px;color:#4a4a5a;margin-top:8px}
@media(max-width:600px){.app{border-radius:0;max-height:100vh;border:none}.bubble{max-width:85%;font-size:14px}.chat-area{padding:16px 14px}}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo"><div class="logo-icon">X</div><span class="logo-text">XENOVA AI</span></div><div class="badge">⚡ Gemini + Backup</div></div>
<div class="chat-area" id="chatArea"><div class="message bot"><div class="avatar bot">X</div><div class="bubble bot">Hello, I am XENOVA AI. Ask me anything and I will give you a clean, accurate answer.<div class="tip">Tip: Keep your questions short for the best answers.</div></div></div></div>
<div class="input-area"><div class="input-wrap"><textarea id="userInput" rows="1" placeholder="Ask anything..." autofocus></textarea><button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></div><div class="footer-note">XENOVA AI · fast · clean · reliable</div></div>
</div>
<script>
const GEMINI_KEYS = ["AQ.Ab8RN6KnyHbFczsIS1sjt7r9wfug9TQz1tL3g2POlIHsjVr1Kg","AQ.Ab8RN6JavdoIOx95fjoFljXRj-Qc8lqBB98aczL36L3UPTQzWQ","AQ.Ab8RN6KySnGCx7yk0bi3DB8FXupFbNxbckGiola0VVKiiqfoxA"];
const MODELS = ["gemini-2.0-flash","gemini-1.5-flash"];
const BACKUP_URL = "https://text.pollinations.ai/";
const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
let isBusy = false;
function scrollToBottom(){chatArea.scrollTop = chatArea.scrollHeight;}
function addMessage(text, sender){
  const msgDiv=document.createElement('div');msgDiv.className=`message ${sender}`;
  const avatar=document.createElement('div');avatar.className=`avatar ${sender}`;avatar.textContent=sender==='user'?'U':'X';
  const bubble=document.createElement('div');bubble.className=`bubble ${sender}`;
  if(sender==='bot' && text.includes('\nTip:')){const parts=text.split('\nTip:');bubble.textContent=parts[0].trim();const tip=document.createElement('div');tip.className='tip';tip.textContent='Tip: '+parts[1].trim();bubble.appendChild(tip);}
  else bubble.textContent=text;
  msgDiv.appendChild(avatar);msgDiv.appendChild(bubble);chatArea.appendChild(msgDiv);scrollToBottom();
}
function addTyping(){const d=document.createElement('div');d.className='message bot';d.id='typingIndicator';d.innerHTML='<div class="avatar bot">X</div><div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>';chatArea.appendChild(d);scrollToBottom();}
function removeTyping(){const el=document.getElementById('typingIndicator');if(el)el.remove();}
function setBusy(s){isBusy=s;sendBtn.disabled=s;userInput.disabled=s;if(!s)userInput.focus();}
function cleanAnswer(raw){
  if(!raw) return "I could not generate a response. Please try again.";
  let t=raw.replace(/```[\s\S]*?```/g,'').replace(/`([^`]+)`/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/https?:\/\/\S+/gi,'').replace(/^#{1,6}\s+/gm,'').replace(/(\*\*|__)(.*?)\1/g,'$2').replace(/(\*|_)(.*?)\1/g,'$2').replace(/^\s*[-*•–—]\s+/gm,'').replace(/^\s*\d+[.)]\s+/gm,'').replace(/[#*]/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n');
  t=t.split('\n').map(l=>l.trim()).filter(l=>l.length>0).join('\n');
  if(!t.trim()) return "I could not generate a response. Please try again.";
  if(!t.toLowerCase().includes('tip:')){const tips=['Ask follow up questions to go deeper.','Short questions often give the clearest answers.','You can ask for examples or comparisons.','Try asking why or how to get better detail.','If an answer is unclear, ask me to simplify it.'];t+='\nTip: '+tips[Math.floor(Math.random()*tips.length)];}
  return t;
}
async function tryGemini(prompt){
  for(const model of MODELS){
    for(let i=0;i<GEMINI_KEYS.length;i++){
      const key=GEMINI_KEYS[i];if(!key||key.startsWith('PASTE')) continue;
      try{
        const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:1024}})});
        if(!res.ok) continue;
        const data=await res.json();const text=data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if(text&&text.trim()) return {ok:true,text};
      }catch(e){continue;}
    }
  }
  return {ok:false};
}
async function tryBackup(prompt){
  try{
    const res=await fetch(BACKUP_URL+encodeURIComponent(prompt));
    if(!res.ok) return {ok:false};
    const text=await res.text();
    if(text&&text.trim()) return {ok:true,text};
  }catch(e){}
  return {ok:false};
}
async function sendMessage(){
  if(isBusy) return;
  const text=userInput.value.trim();if(!text) return;
  addMessage(text,'user');userInput.value='';userInput.style.height='auto';setBusy(true);addTyping();
  const prompt="You are XENOVA AI. Give short, clean, accurate answer. User: "+text;
  let result=await tryGemini(prompt);
  if(!result.ok) result=await tryBackup(prompt);
  removeTyping();
  if(result.ok) addMessage(cleanAnswer(result.text),'bot');
  else addMessage("All keys failed and backup failed. Check your API keys and internet, then try again.",'bot');
  setBusy(false);
}
sendBtn.addEventListener('click',sendMessage);
userInput.addEventListener('keydown',function(e){if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendMessage();}});
userInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
</script>
</body>
</html>
